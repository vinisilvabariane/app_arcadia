<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcádia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* IMPORTANTE: este arquivo não usa crases (template strings) de propósito,
     porque elas se perdiam ao colar no Apps Script. */
  :root {
    --ink: #0b0c12;
    --ink-2: #12141d;
    --ink-3: #1b1e2a;
    --line: #262a38;
    --text: #eef0f6;
    --muted: #8c92a6;
    --tint: #e8a33d;
    --radius: 8px;
    --card-w: 172px;
    --gutter: 4vw;
    --display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;
    --body: 'Hanken Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --barh: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); }
  body { overflow-x: hidden; transition: background-color .4s; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 3px; border-radius: 4px; }
  svg { display: block; }

  /* ambiente: um brilho da cor do console no topo da página */
  .glow {
    position: fixed; inset: 0 0 auto 0; height: 70vh; pointer-events: none; z-index: 0;
    background: radial-gradient(80% 60% at 20% 0%, color-mix(in srgb, var(--tint) 22%, transparent), transparent 70%);
    transition: background .5s;
  }
  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* ---------------- topo ---------------- */
  .bar {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(to bottom, rgba(11,12,18,.9), rgba(11,12,18,.55));
    transition: background .3s, box-shadow .3s;
  }
  html.scrolled .bar { background: rgba(11,12,18,.97); box-shadow: 0 1px 0 var(--line), 0 12px 30px -18px rgba(0,0,0,.8); }

  /* navegação */
  .links { display: flex; align-items: center; gap: 2px; margin-left: 6px; }
  .nav-link {
    position: relative; display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 13px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap;
    transition: color .15s, background .15s;
  }
  .nav-link:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .nav-link.on { color: var(--text); }
  .nav-link.on::after { content: ''; position: absolute; left: 13px; right: 13px; bottom: 1px; height: 2px; border-radius: 2px; background: var(--tint); transition: background .4s; }
  .nav-link .chev { transition: transform .2s; opacity: .7; }
  .menu-wrap { position: relative; }
  .menu-wrap.open .chev { transform: rotate(180deg); }
  .menu {
    position: absolute; top: calc(100% + 12px); left: -10px; z-index: 40;
    width: min(600px, 86vw); max-height: 72vh; overflow: auto;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    box-shadow: 0 30px 70px -10px rgba(0,0,0,.75);
    display: none;
  }
  .menu-wrap.open .menu { display: block; animation: rise .18s cubic-bezier(.2,.8,.2,1); }
  .menu-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 8px 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .menu-head button { font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--tint); }
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
  .menu-item { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px; font-size: 14px; text-align: left; min-width: 0; }
  .menu-item:hover, .menu-item:focus-visible { background: var(--ink-3); }
  .menu-item.on { background: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
  .menu-item .sw {
    flex: none; width: 34px; height: 26px; border-radius: 6px; display: grid; place-items: center;
    background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 45%, #000));
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75; font-size: 11px; color: #fff;
  }
  .menu-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tabbar { display: none; }

  /* página de emuladores */
  .emus-hero { padding: 6vh var(--gutter) 10px; max-width: 900px; }
  .emus-hero h1 { font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75; font-size: clamp(48px, 8vw, 104px); line-height: .88; margin: 10px 0 14px; }
  .emus-hero p { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 0; max-width: 60ch; }
  .emus-hero p b { color: var(--text); font-weight: 600; }
  .emus { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .emu {
    --c: var(--tint);
    position: relative; display: flex; flex-direction: column; gap: 14px; overflow: hidden;
    padding: 22px; border-radius: 14px; background: var(--ink-2);
    box-shadow: inset 0 0 0 1px var(--line);
    transition: transform .2s, box-shadow .2s;
  }
  .emu::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
  .emu::after { content: ''; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); pointer-events: none; }
  .emu:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, var(--line)), 0 20px 40px -20px rgba(0,0,0,.8); }
  .emu.wide { grid-column: span 2; flex-direction: row; align-items: stretch; gap: 28px; padding: 28px; }
  .emu.wide .emu-main { flex: 1.1; display: flex; flex-direction: column; gap: 14px; }
  .emu.wide .emu-side { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
  .emu-name { font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 78; font-size: 32px; line-height: 1; }
  .emu.wide .emu-name { font-size: 52px; }
  .emu-for { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--c); filter: brightness(1.35); margin-top: 8px; }
  .emu-desc { margin: 0; color: #c3c7d4; font-size: 14px; line-height: 1.55; }
  .emu-consoles { display: flex; flex-wrap: wrap; gap: 6px; }
  .emu-consoles .tag { font-family: var(--mono); font-size: 11px; background: rgba(255,255,255,.06); color: var(--muted); }
  .emu-consoles .tag.mine { background: color-mix(in srgb, var(--k) 30%, transparent); color: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 70%, transparent); }
  .emu-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
  .emu-os { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .btn.sm { padding: 9px 16px 9px 14px; font-size: 14px; }
  .note-box { margin-top: 26px; padding: 16px 18px; border-radius: 10px; background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 14px; line-height: 1.55; }
  .note-box b { color: var(--text); }
  .emu-hint { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .emu-hint b { color: var(--text); font-weight: 600; }
  .emu-hint:hover b { color: var(--tint); }
  .top {
    display: flex; align-items: center; gap: 18px;
    padding: 14px var(--gutter);
  }
  .logo { flex: none; border-radius: 8px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; }
  .brand .mark { width: 32px; height: 32px; overflow: visible; filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--tint) 45%, transparent)); transition: filter .4s; }
  .brand .mark .body { transition: fill .4s; }
  .brand .word {
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75;
    font-size: 25px; letter-spacing: .05em; line-height: 1; color: var(--text); white-space: nowrap;
  }
  .brand .word .acc { color: var(--tint); transition: color .4s; }
  .logo:hover .mark { transform: rotate(-6deg); }
  .brand .mark { transition: transform .25s cubic-bezier(.2,.8,.2,1), filter .4s; }
  .nav-link .count, .tab .count {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center;
    font-family: var(--mono); font-size: 10px; background: var(--tint); color: #0b0c12; font-weight: 500;
  }
  .nav-link .count:empty, .tab .count:empty { display: none; }
  .tab { position: relative; }
  .tab .count { position: absolute; top: 0; left: 55%; }

  /* favoritos */
  .i-on { display: none; }
  .fav.on > .i-on, .favb.on > .i-on, .big > .i-on { display: block; }
  .fav.on > .i-off, .favb.on > .i-off { display: none; }
  .card .fav {
    position: absolute; left: 10px; top: 10px; z-index: 4; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(11,12,18,.78); color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); opacity: 0; transform: scale(.8); transition: opacity .2s, transform .2s, color .2s;
  }
  .card:hover .fav, .card:focus-within .fav, .card .fav.on { opacity: 1; transform: scale(1); }
  .card .fav:hover { transform: scale(1.08); }
  .card .fav.on, .favb.on > .i-on { color: #ff5470; }
  .favb.on { background: rgba(255,84,112,.16); }
  @keyframes pop { 40% { transform: scale(1.3); } }
  .fav.pop, .favb.pop .i-on { animation: pop .35s ease-out; }

  /* home: destaque grande */
  .hero {
    position: relative; overflow: hidden; display: flex; align-items: flex-end;
    min-height: min(80vh, 760px); margin-top: calc(var(--barh) * -1);
    padding: calc(var(--barh) + 40px) var(--gutter) 9vh;
  }
  .hero-bg {
    position: absolute; inset: -50px; background-size: cover; background-position: center 25%;
    filter: blur(12px) saturate(1.4) brightness(.62); transform: scale(1.15);
  }
  .hero::after {
    content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(to top, var(--ink) 1%, rgba(11,12,18,.6) 22%, transparent 50%),
      linear-gradient(90deg, rgba(11,12,18,.96) 0%, rgba(11,12,18,.55) 48%, rgba(11,12,18,.1) 78%);
  }
  .hero-inner { position: relative; z-index: 1; width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; }
  .hero-text { max-width: 680px; }
  .hero .eyebrow { display: flex; align-items: center; gap: 10px; }
  .sw {
    flex: none; display: inline-grid; place-items: center; min-width: 34px; height: 24px; padding: 0 6px; border-radius: 6px;
    background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 45%, #000));
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75; font-size: 11px; letter-spacing: .02em; color: #fff;
  }
  .hero h1 {
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75;
    font-size: clamp(46px, 7.4vw, 112px); line-height: .86; letter-spacing: -.01em;
    margin: 14px 0 18px; text-wrap: balance; text-shadow: 0 6px 40px rgba(0,0,0,.45);
  }
  .hero-cover {
    flex: none; width: clamp(170px, 21vw, 300px); margin: 0 3vw 8px 0;
    transform: perspective(1000px) rotateY(-16deg) rotateX(3deg); transform-origin: right center;
  }
  .hero-cover .poster { border-radius: 10px; box-shadow: 30px 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.08); }
  .hero.swap .hero-text { animation: heroIn .7s cubic-bezier(.2,.8,.2,1); }
  .hero.swap .hero-cover .poster { animation: coverIn .8s cubic-bezier(.2,.8,.2,1); }
  @keyframes heroIn { from { opacity: 0; transform: translateY(18px); } }
  @keyframes coverIn { from { opacity: 0; transform: translateX(30px) scale(.96); } }
  .dots { position: absolute; right: var(--gutter); bottom: 4.5vh; z-index: 2; display: flex; gap: 6px; }
  .dots button { width: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); transition: width .3s, background .3s; }
  .dots button.on { width: 36px; background: var(--tint); }
  .dots button:hover { background: rgba(255,255,255,.6); }

  /* home: fileira de consoles */
  .ctile {
    --c: var(--tint); flex: none; position: relative; width: 176px; height: 104px; border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 14px; text-align: left;
    background: linear-gradient(150deg, color-mix(in srgb, var(--c) 80%, #000) 0%, color-mix(in srgb, var(--c) 28%, var(--ink)) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); transition: transform .2s, box-shadow .2s;
  }
  .ctile:hover, .ctile:focus-visible { transform: translateY(-3px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); outline: none; }
  .ctile .short { font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75; font-size: 34px; line-height: .85; }
  .ctile .nm { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .85; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctile .n { position: absolute; top: 10px; right: 12px; font-family: var(--mono); font-size: 11px; opacity: .75; }
  .row-head .see-all { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
  .row-head .see-all:hover { color: var(--tint); }

  /* minha lista vazia */
  .empty-state { text-align: center; padding: 60px 20px 90px; color: var(--muted); }
  .empty-state .big { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); color: #ff5470; }
  .empty-state .big svg { width: 30px; height: 30px; }
  .empty-state h3 { color: var(--text); font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 80; font-size: 28px; margin: 0 0 8px; }
  .empty-state p { margin: 0 auto 22px; max-width: 42ch; line-height: 1.55; }
  .crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; white-space: nowrap; min-width: 0; }
  .crumb b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .crumb button:hover { color: var(--text); }
  .search {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
    background: var(--ink-3); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; width: min(380px, 42vw); transition: border-color .2s, width .3s;
  }
  .search:focus-within { border-color: var(--tint); width: min(460px, 50vw); }
  /* telas médias: nav sem ícones pra sobrar espaço pra busca */
  @media (min-width: 721px) and (max-width: 1100px) {
    .nav-link { padding: 9px 9px; }
    .nav-link > svg { display: none; }
    .nav-link.on::after { left: 9px; right: 9px; }
    .search { min-width: 150px; }
  }
  .search input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 15px; }
  .search input::placeholder { color: var(--muted); }
  .search kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  .icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--ink-3); border: 1px solid var(--line); }
  .icon-btn:hover { border-color: var(--tint); }
  .icon-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* faixa de filtros por console */
  .filters {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 4px var(--gutter) 14px;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters { scroll-behavior: smooth; }
  /* faixa rolável: setas e esmaecido só aparecem do lado em que ainda tem tag escondida */
  .fwrap { position: relative; --fade: calc(var(--gutter) + 56px); }
  .fwrap.r .filters { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - var(--fade)), transparent calc(100% - 8px)); mask-image: linear-gradient(to right, #000 calc(100% - var(--fade)), transparent calc(100% - 8px)); }
  .fwrap.l .filters { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - var(--fade)), transparent calc(100% - 8px)); mask-image: linear-gradient(to left, #000 calc(100% - var(--fade)), transparent calc(100% - 8px)); }
  .fwrap.l.r .filters { -webkit-mask-image: linear-gradient(to right, transparent 8px, #000 var(--fade), #000 calc(100% - var(--fade)), transparent calc(100% - 8px)); mask-image: linear-gradient(to right, transparent 8px, #000 var(--fade), #000 calc(100% - var(--fade)), transparent calc(100% - 8px)); }
  .farrow {
    position: absolute; top: 3px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; background: var(--ink-3); border: 1px solid var(--line); color: var(--text);
    box-shadow: 0 6px 18px -6px rgba(0,0,0,.8); opacity: 0; pointer-events: none; transform: scale(.85);
    transition: opacity .2s, transform .2s, border-color .2s;
  }
  .farrow:hover { border-color: var(--tint); }
  .farrow.l { left: max(6px, calc(var(--gutter) - 46px)); }
  .farrow.r { right: max(6px, calc(var(--gutter) - 46px)); }
  .fwrap.l .farrow.l, .fwrap.r .farrow.r { opacity: 1; pointer-events: auto; transform: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--ink-2); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 500; color: #c9cddb; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
  .chip .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .chip:hover { border-color: var(--c, var(--tint)); color: #fff; }
  .chip.on { background: var(--c, var(--tint)); border-color: var(--c, var(--tint)); color: #fff; }
  .chip.on .n, .chip.on .dot { color: rgba(255,255,255,.8); background-color: rgba(255,255,255,.85); }
  .chip.on .n { background: none; }

  /* ---------------- início: escolha do console ---------------- */
  .picker { padding: 5vh var(--gutter) 30px; }
  .picker h1 {
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75;
    font-size: clamp(44px, 8vw, 104px); line-height: .9; letter-spacing: -.01em; margin: 0;
  }
  .picker .lede { color: var(--muted); margin: 14px 0 34px; font-size: 15px; }
  .picker .lede b { color: var(--text); font-family: var(--mono); font-weight: 500; }
  .consoles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }

  .tile {
    --c: var(--tint);
    position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; text-align: left;
    background:
      radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--c) 85%, #fff 0%), transparent 60%),
      linear-gradient(150deg, color-mix(in srgb, var(--c) 70%, #000) 0%, color-mix(in srgb, var(--c) 25%, var(--ink)) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    isolation: isolate;
  }
  .tile:hover, .tile:focus-visible { transform: translateY(-4px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 18px 40px -12px color-mix(in srgb, var(--c) 70%, transparent); outline: none; }
  .tile .label { position: absolute; left: 18px; bottom: 16px; right: 45%; z-index: 2; }
  .tile .short {
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75;
    font-size: 46px; line-height: .85; letter-spacing: -.01em; text-shadow: 0 2px 20px rgba(0,0,0,.35);
  }
  .tile .full { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; opacity: .85; }
  .tile .count { font-family: var(--mono); font-size: 12px; margin-top: 6px; opacity: .75; }
  .tile .pt { position: absolute; top: 12px; left: 14px; z-index: 2; font-size: 10px; font-weight: 700; letter-spacing: .1em; background: rgba(0,0,0,.4); border-radius: 4px; padding: 3px 7px; }

  /* leque de capas: a assinatura da tela inicial */
  .fan { position: absolute; right: 8%; top: 50%; width: 34%; aspect-ratio: 3 / 4; transform: translateY(-46%); z-index: 1; }
  .fan .poster {
    position: absolute; inset: 0; border-radius: 6px; box-shadow: 0 10px 24px rgba(0,0,0,.45);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .fan .poster:nth-child(1) { transform: rotate(-12deg) translate(-26%, 4%); }
  .fan .poster:nth-child(2) { transform: rotate(-3deg) translate(-8%, 0); }
  .fan .poster:nth-child(3) { transform: rotate(7deg) translate(12%, 2%); }
  .tile:hover .fan .poster:nth-child(1), .tile:focus-visible .fan .poster:nth-child(1) { transform: rotate(-20deg) translate(-52%, 8%); }
  .tile:hover .fan .poster:nth-child(2), .tile:focus-visible .fan .poster:nth-child(2) { transform: rotate(-4deg) translate(-12%, -6%); }
  .tile:hover .fan .poster:nth-child(3), .tile:focus-visible .fan .poster:nth-child(3) { transform: rotate(14deg) translate(30%, 4%); }
  .fan .poster .ph { font-size: 11px; padding: 8px; }

  /* pastas dentro de um console */
  .folders { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .tile.sub { aspect-ratio: 16 / 9; }
  .tile.sub .label { right: 40%; bottom: 14px; }
  .tile.sub .ficon { opacity: .85; margin-bottom: 8px; }
  .tile.sub .short { font-size: 28px; line-height: .95; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile.sub .fan { width: 28%; }
  .section.folder-section { padding-bottom: 6px; }
  .folder-head { position: relative; padding: 34px var(--gutter) 6px; }
  .folder-head .path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 14px; color: var(--muted); }
  .folder-head .path button:hover { color: var(--text); }
  .folder-head .path b { color: var(--text); font-weight: 600; }
  .folder-head h2 { font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75; font-size: clamp(40px, 6.5vw, 84px); line-height: .9; margin: 12px 0 12px; }
  .folder-head .back { margin-top: 18px; padding: 9px 18px 9px 12px; font-size: 14px; }

  /* ---------------- destaque (billboard) ---------------- */
  .billboard { position: relative; min-height: min(50vh, 520px); display: flex; align-items: flex-end; padding: 40px var(--gutter) 40px; overflow: hidden; }
  .billboard .bg { position: absolute; inset: -60px; background-size: cover; background-position: center 30%; filter: blur(14px) saturate(1.3) brightness(.55); transform: scale(1.15); }
  .billboard::after {
    content: ''; position: absolute; inset: 0; z-index: 0;
    background:
      linear-gradient(to top, var(--ink) 2%, transparent 55%),
      linear-gradient(to right, rgba(11,12,18,.92) 10%, rgba(11,12,18,.2) 70%);
  }
  .billboard .inner { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 32px; width: 100%; }
  .billboard .cover { width: clamp(130px, 16vw, 210px); flex: none; }
  .billboard .cover .poster { box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--tint); }
  .billboard h2 {
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 78;
    font-size: clamp(34px, 5.6vw, 76px); line-height: .92; margin: 10px 0 14px; max-width: 15ch;
    text-wrap: balance;
  }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: 14px; }
  .meta .mono { font-family: var(--mono); font-size: 13px; }
  .tag { background: rgba(255,255,255,.09); color: #d9dce6; border-radius: 4px; padding: 2px 8px; font-size: 12px; font-weight: 500; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 9px; border-radius: 6px; padding: 12px 24px 12px 20px; font-weight: 700; font-size: 15px; transition: transform .15s, background .15s; }
  .btn-play { background: var(--text); color: #0b0c12; }
  .btn-play:hover { background: #fff; transform: translateY(-1px); }
  .btn-soft { background: rgba(255,255,255,.14); }
  .btn-soft:hover { background: rgba(255,255,255,.24); }

  /* ---------------- fileiras ---------------- */
  .row { margin: 30px 0 4px; }
  .row-head { display: flex; align-items: baseline; gap: 12px; padding: 0 var(--gutter); margin-bottom: 8px; }
  .row-head h3 { margin: 0; font-size: 19px; font-weight: 700; }
  .row-head .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .rail-wrap { position: relative; }
  .rail { display: flex; gap: 10px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; padding: 10px var(--gutter) 22px; scroll-padding: 0 var(--gutter); }
  .rail::-webkit-scrollbar { display: none; }
  .arrow {
    position: absolute; top: 10px; bottom: 22px; width: var(--gutter); min-width: 40px; z-index: 3;
    display: grid; place-items: center; background: rgba(11,12,18,.72); opacity: 0; transition: opacity .2s;
  }
  .arrow.l { left: 0; } .arrow.r { right: 0; }
  .rail-wrap:hover .arrow, .arrow:focus-visible { opacity: 1; }

  /* ---------------- cards ---------------- */
  .card { position: relative; flex: none; width: var(--card-w); }
  .card .hit { display: block; width: 100%; text-align: left; border-radius: var(--radius); }
  .poster { position: relative; aspect-ratio: 3 / 4; border-radius: var(--radius); overflow: hidden; background: var(--ink-3); }
  .poster img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
  .poster .ph {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
    padding: 14px; font-family: var(--display); font-weight: 700; font-variation-settings: 'wdth' 85; font-size: 17px; line-height: 1.05;
  }
  .poster .ph small { font-family: var(--body); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .card .shade {
    position: absolute; inset: 0; z-index: 2; border-radius: var(--radius); pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.3) 45%, transparent 70%);
    opacity: 0; transition: opacity .2s;
  }
  .card .info { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
  .card .info .t { font-weight: 700; font-size: 14px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .info .s { font-family: var(--mono); font-size: 11px; color: #b9bdcc; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .quick {
    position: absolute; right: 10px; top: 10px; z-index: 4; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; background: var(--text); color: #0b0c12; opacity: 0; transform: scale(.8); transition: opacity .2s, transform .2s;
  }
  .card .quick:hover { background: #fff; transform: scale(1.06); }
  .card .poster { transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s; }
  .card:hover .poster, .card:focus-within .poster { transform: scale(1.06); box-shadow: 0 16px 34px -10px rgba(0,0,0,.8), 0 0 0 2px var(--tint); }
  .card:hover .shade, .card:focus-within .shade { opacity: 1; transform: scale(1.06); }
  .card:hover .info, .card:focus-within .info { opacity: 1; transform: translateY(0) scale(1.0); }
  .card:hover .quick, .card:focus-within .quick { opacity: 1; transform: scale(1); }
  .card .below { font-size: 13px; color: #c3c7d4; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { position: absolute; left: 8px; top: 8px; z-index: 2; font-family: var(--mono); font-size: 10px; text-transform: uppercase; background: rgba(0,0,0,.6); border-radius: 3px; padding: 2px 6px; }
  .flag { position: absolute; right: 8px; bottom: 8px; z-index: 2; font-size: 10px; font-weight: 800; letter-spacing: .08em; color: #0b0c12; background: #f2c94c; border-radius: 3px; padding: 2px 6px; }
  .card:hover .flag { opacity: 0; }
  .skeleton .poster { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* ---------------- grade (todos os jogos / busca) ---------------- */
  .section { padding: 34px var(--gutter) 70px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 18px; }
  .section-head h3 { margin: 0; font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 80; font-size: 30px; }
  .section-head .n { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .sort { margin-left: auto; display: flex; gap: 4px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .sort button { padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .sort button.on { background: var(--ink-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr)); gap: 26px 12px; }
  .grid .card { width: auto; }
  .more { display: block; margin: 30px auto 0; padding: 12px 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink-2); font-weight: 600; }
  .more:hover { border-color: var(--tint); }
  .empty { color: var(--muted); padding: 50px 0; font-size: 15px; }
  .empty b { color: var(--text); }

  .search-hero { padding: 20px var(--gutter) 0; }
  .search-hero h2 { font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 78; font-size: clamp(30px, 4.5vw, 54px); margin: 0 0 6px; line-height: 1; }
  .search-hero h2 em { font-style: normal; color: var(--tint); }
  .search-hero .n { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .search-hero + .filters { padding-top: 6px; }

  /* ---------------- detalhes (modal) ---------------- */
  .modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(4,5,8,.78); display: none; overflow-y: auto; padding: 5vh 16px; }
  .modal-bg.open { display: block; animation: fade .2s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .modal { position: relative; width: min(860px, 100%); margin: 0 auto; background: var(--ink-2); border-radius: 14px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.7); animation: rise .25s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } }
  .modal .head { position: relative; display: flex; gap: 28px; align-items: flex-end; padding: 60px 32px 28px; overflow: hidden; }
  .modal .head .bg { position: absolute; inset: -50px; background-size: cover; background-position: center; filter: blur(12px) brightness(.5) saturate(1.3); }
  .modal .head::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--ink-2), transparent 80%); }
  .modal .head > * { position: relative; z-index: 1; }
  .modal .head .cover { width: 190px; flex: none; }
  .modal h2 { font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 80; font-size: clamp(28px, 4vw, 44px); line-height: .95; margin: 8px 0 12px; }
  .modal .body { padding: 6px 32px 32px; }
  .modal .file { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; padding: 12px 14px; background: var(--ink); border-radius: 6px; }
  .modal .note { color: var(--muted); font-size: 13px; margin-top: 12px; line-height: 1.5; }
  .modal .close { position: absolute; right: 14px; top: 14px; z-index: 5; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(11,12,18,.75); }
  .modal .close:hover { background: var(--ink); }
  .modal h4 { margin: 28px 0 12px; font-size: 16px; }
  .modal .mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
  .modal .mini .card { width: auto; }
  .modal .mini .below { font-size: 12px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; background: var(--ink-3); border: 1px solid var(--line); border-radius: 8px; padding: 12px 18px; font-size: 14px; display: none; }
  .error-box { margin: 40px var(--gutter); padding: 20px 22px; border: 1px solid #e0533d; border-radius: 10px; background: rgba(224,83,61,.08); line-height: 1.55; }
  .error-box code { font-family: var(--mono); background: var(--ink-3); padding: 2px 6px; border-radius: 4px; }

  @media (max-width: 720px) {
    :root { --card-w: 118px; --gutter: 16px; }
    .top { gap: 10px; padding: 10px var(--gutter); flex-wrap: wrap; }
    .links { display: none; }
    :root { --barh: 112px; }
    .brand .word { font-size: 21px; }
    .brand .mark { width: 28px; height: 28px; }
    .hero { min-height: 0; padding-bottom: 46px; }
    .hero-inner { flex-direction: column-reverse; align-items: flex-start; gap: 22px; }
    .hero-cover { width: 150px; transform: none; }
    .hero h1 { font-size: 46px; }
    .dots { bottom: 18px; }
    .ctile { width: 138px; height: 90px; }
    .ctile .short { font-size: 28px; }
    body { padding-bottom: 74px; }
    /* o desfoque na barra do topo prende a tabbar (fixed) dentro dela; no celular usa fundo sólido */
    html.scrolled .bar { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgb(11,12,18); }
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: rgb(11,12,18);
      border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); }
    .tab.on { color: var(--tint); }
    .menu { position: fixed; left: 12px; right: 12px; top: auto; bottom: 80px; width: auto; }
    .menu-wrap.open .menu { animation: none; box-shadow: 0 0 0 100vmax rgba(4,5,8,.6), 0 30px 70px -10px rgba(0,0,0,.75); }
    .menu-grid { grid-template-columns: 1fr; }
    .emu.wide { grid-column: auto; flex-direction: column; padding: 22px; gap: 14px; }
    .emu.wide .emu-name { font-size: 38px; }
    .logo { font-size: 20px; }
    .search, .search:focus-within { order: 3; width: 100%; margin-left: 0; }
    .search kbd { display: none; }
    .top .icon-btn { margin-left: auto; }
    .consoles { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tile { aspect-ratio: 1 / 1; }
    .tile .label { right: 14px; }
    .tile .short { font-size: 34px; }
    .tile .full { font-size: 10px; }
    .fan { width: 42%; top: 30%; right: 6%; }
    .folders { grid-template-columns: 1fr; }
    .tile.sub { aspect-ratio: 21 / 9; }
    .tile.sub .short { font-size: 24px; }
    .tile.sub .fan { width: 24%; top: 50%; }
    .billboard { min-height: 0; padding-top: 28px; }
    .billboard .inner { flex-direction: column; align-items: flex-start; gap: 18px; }
    .arrow { display: none; }
    .card .quick { opacity: 1; transform: none; width: 30px; height: 30px; }
    .modal .head { flex-direction: column; align-items: flex-start; padding: 50px 20px 20px; }
    .modal .head .cover { width: 140px; }
    .modal .body { padding: 6px 20px 24px; }
    .sort { margin-left: 0; }
  }
  /* desempenho: o navegador pula o desenho das fileiras fora da tela */
  .row { content-visibility: auto; contain-intrinsic-size: auto 330px; }

  /* ---------------- franquias ---------------- */
  .picker .eyebrow { margin-bottom: 10px; }
  .tile.franq .short { font-size: 30px; }
  .tile.franq .cons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .tile.franq .cons span { font-family: var(--mono); font-size: 10px; background: rgba(0,0,0,.35); border-radius: 3px; padding: 2px 5px; }
  .fhero {
    position: relative; overflow: hidden; isolation: isolate;
    margin-top: calc(var(--barh) * -1); padding: calc(var(--barh) + 70px) var(--gutter) 54px;
    min-height: min(72vh, 640px); display: flex; flex-direction: column; justify-content: flex-end;
    background: radial-gradient(90% 80% at 85% 20%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%);
  }
  .fhero .mosaic {
    position: absolute; z-index: -1; top: -30%; bottom: -30%; left: 32%; right: -12%;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; align-content: center;
    transform: rotate(-10deg); opacity: .6;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 45%); mask-image: linear-gradient(to right, transparent, #000 45%);
    animation: mosaic 50s ease-in-out infinite alternate; will-change: translate;
  }
  .fhero .mosaic .poster { box-shadow: 0 20px 40px -16px rgba(0,0,0,.9); }
  .fhero .mosaic .poster:nth-child(even) { transform: translateY(40%); }
  @keyframes mosaic { from { translate: 0 -6%; } to { translate: 0 6%; } }
  .fhero::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(to top, var(--ink) 2%, transparent 40%), linear-gradient(to right, var(--ink) 10%, transparent 70%); }
  .fhero .inner { position: relative; z-index: 1; max-width: 760px; }
  .fhero .path { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .fhero .path button:hover { color: var(--text); }
  .fhero .path b { color: var(--text); font-weight: 600; }
  .fhero h1 {
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75; font-size: clamp(52px, 9.5vw, 140px); line-height: .86; letter-spacing: -.01em;
    margin: 16px 0 14px; text-shadow: 0 10px 40px rgba(0,0,0,.6);
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .fhero .fmeta { font-family: var(--mono); font-size: 14px; color: #c9cddb; margin: 0; }
  .fhero .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

  /* ---------------- sinopse ---------------- */
  .syn-h { margin-top: 4px !important; }
  .syn { margin: 0 0 18px; max-width: 70ch; }
  .result .syn { margin: 16px 0 0; }
  .syn-text { margin: 0; font-size: 15px; line-height: 1.6; color: #c9cddb; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .syn.open .syn-text { -webkit-line-clamp: unset; display: block; }
  .syn-foot { display: flex; align-items: center; gap: 16px; margin-top: 8px; font-size: 13px; }
  .syn-foot a, .syn-none a { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .syn-foot a:hover, .syn-none a:hover { color: var(--text); }
  .syn-foot svg, .syn-none svg { width: 13px; height: 13px; }
  .syn-more { font-weight: 700; color: var(--tint); filter: brightness(1.3); }
  .syn-none { margin: 0; font-size: 14px; color: var(--muted); }
  .syn-none a { margin-left: 4px; }
  .syn-skel { display: grid; gap: 9px; padding: 4px 0; }
  .syn-skel i { display: block; height: 11px; border-radius: 6px; background: linear-gradient(90deg, var(--ink-3), #262a38, var(--ink-3)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .syn-skel i:nth-child(2) { width: 92%; }
  .syn-skel i:nth-child(3) { width: 64%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------------- sorteio ---------------- */
  .raffle { padding: 5vh 0 40px; }
  .raffle-head { padding: 0 var(--gutter); max-width: 900px; }
  .raffle-head h1 {
    font-family: var(--display); font-weight: 800; font-variation-settings: 'wdth' 75; font-size: clamp(56px, 9vw, 128px); line-height: .86; margin: 10px 0 14px;
    background: linear-gradient(100deg, var(--text) 30%, var(--tint) 75%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .raffle-head p { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 0; max-width: 56ch; }
  .raffle-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 24px var(--gutter) 0; }
  .sel, .switch {
    display: inline-flex; align-items: center; gap: 10px; height: 42px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--ink-2); font-size: 14px; color: #c9cddb; transition: border-color .2s;
  }
  .sel { position: relative; padding: 0 16px 0 18px; color: var(--muted); font-size: 13px; }
  .sel:hover, .switch:hover { border-color: color-mix(in srgb, var(--tint) 60%, var(--line)); }
  .sel select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; color: var(--text); font: 600 14px var(--body); padding: 0 4px 0 0; cursor: pointer; outline: none; max-width: 52vw; }
  .sel select option { background: var(--ink-2); color: var(--text); }
  .sel:focus-within { border-color: var(--tint); }
  .switch { padding: 0 18px 0 12px; }
  .switch i { position: relative; width: 32px; height: 20px; border-radius: 99px; background: var(--ink-3); border: 1px solid var(--line); transition: background .2s, border-color .2s; }
  .switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .22s cubic-bezier(.3,1.5,.5,1), background .2s; }
  .switch.on { color: var(--text); }
  .switch.on i { background: color-mix(in srgb, var(--tint) 30%, transparent); border-color: var(--tint); }
  .switch.on i::after { transform: translateX(12px); background: var(--tint); }
  .pool-n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 6px; }

  .stage {

/* ---------- links ---------- */
/* ---------- capas: busca por semelhança no acervo do libretro ----------
   Para cada console, baixamos uma vez a lista de nomes das capas (API do GitHub)
   e guardamos no navegador. Aí comparamos os nomes "simplificados":
   sem maiúsculas, acentos, pontuação, região, "The"/"A" e sem o "I" final. */
var COVER_IDX = {};          // sistema -> { map: {chave: [nomes]}, keys: [chaves ordenadas] }
var COVER_CACHE_DAYS = 14;

function repoName(sys) { return sys.replace(/ /g, '_'); }
function coverKey(s) {
  s = String(s).replace(/\.png$/i, '').replace(/\s*[\(\[][^\)\]]*[\)\]]/g, ' ').replace(/&/g, ' and ');
  s = s.toLowerCase().normalize('NFD').replace(/[^\x00-\x7F]/g, '').replace(/_/g, ' ');
  s = s.replace(/\b(the|a|an)\b/g, ' ');
  return s.replace(/[^a-z0-9]/g, '');
}
function regionScore(name) {
  var s = /\(USA/.test(name) ? 0 : /\(World/.test(name) ? 1 : /\(Brazil/.test(name) ? 2 : /Europe/.test(name) ? 3 : /Japan/.test(name) ? 4 : 5;
  if (/\((Beta|Proto|Demo|Sample|Pirate|Unl|Aftermarket)/i.test(name)) s += 10;
  if (/Switch Online|Virtual Console|Collection/i.test(name)) s += 1;
  return s;
}
function buildCoverIdx(names) {
  var map = Object.create(null), keys = [];   // sem protótipo: nomes como "constructor" não quebram
  names.forEach(function (n) {
    var k = coverKey(n);
    if (!k) return;
    if (!map[k]) { map[k] = []; keys.push(k); }
    map[k].push(n.replace(/\.png$/i, ''));
  });
  keys.sort();
  return { map: map, keys: keys };
}
function bestOf(list) { return list.slice().sort(function (a, b) { return regionScore(a) - regionScore(b) || a.length - b.length; })[0]; }
function findCover(g) {
  if (g._cover !== undefined) return g._cover;
  var idx = COVER_IDX[g.sys];
  if (!idx || !idx.map) return null;               // lista ainda não carregou
  var mem = matchMem(g.sys);
  if (Object.prototype.hasOwnProperty.call(mem, g.base)) return (g._cover = mem[g.base] || null);
  var clean = g.base.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').trim();
  var tries = [coverKey(clean)];
  if (/\s(I|1)$/i.test(clean)) tries.push(coverKey(clean.replace(/\s(I|1)$/i, '')));
  var hit = null, i;
  for (i = 0; i < tries.length && !hit; i++) if (idx.map[tries[i]]) hit = bestOf(idx.map[tries[i]]);
  // Por palavras: todas as palavras do seu nome precisam aparecer no nome do acervo
  // (tolerando 1 letra de diferença em palavras longas). Ganha o que tiver menos palavras sobrando.
  if (!hit) hit = wordMatch(idx, clean);
  g._cover = hit;
  mem[g.base] = hit || '';
  saveMatchMem(g.sys);
  return hit;
}
/* Guarda no navegador qual capa casou com cada nome, pra não refazer a busca na próxima visita. */
var MATCH_MEM = {}, matchDirty = {}, matchTimer;
function matchMem(sys) {
  if (!MATCH_MEM[sys]) {
    try { MATCH_MEM[sys] = JSON.parse(localStorage.getItem('arc-match-v1:' + sys) || '{}'); } catch (e) { MATCH_MEM[sys] = {}; }
  }
  return MATCH_MEM[sys];
}
function saveMatchMem(sys) {
  matchDirty[sys] = 1;
  clearTimeout(matchTimer);
  matchTimer = setTimeout(function () {
    Object.keys(matchDirty).forEach(function (k) {
      try { localStorage.setItem('arc-match-v1:' + k, JSON.stringify(MATCH_MEM[k])); } catch (e) { /* sem espaço */ }
    });
    matchDirty = {};
  }, 1500);
}
function coverWords(s) {
  s = String(s).replace(/\.png$/i, '').replace(/\s*[\(\[][^\)\]]*[\)\]]/g, ' ').replace(/&/g, ' and ').replace(/'/g, '');
  s = s.toLowerCase().normalize('NFD').replace(/[^\x00-\x7F]/g, '');
  return s.split(/[^a-z0-9]+/).filter(function (w) { return w && w !== 'the' && w !== 'a' && w !== 'an'; });
}
function nearWord(a, b) {
  if (a === b) return true;
  if (a.length < 5 || b.length < 5 || Math.abs(a.length - b.length) > 1) return false;
  var i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}
function wordMatch(idx, name) {
  var want = coverWords(name);
  if (!want.length) return null;
  if (!idx.words) {
    idx.words = idx.keys.map(function (k) { var n = idx.map[k][0]; return { key: k, w: coverWords(n) }; });
    idx.byWord = Object.create(null);
    idx.words.forEach(function (e, i) { e.w.forEach(function (w) { (idx.byWord[w] || (idx.byWord[w] = [])).push(i); }); });
  }
  // candidatos: nomes que contêm a palavra mais rara do seu nome; se nenhuma existir igual, varre tudo
  var pool = null;
  want.forEach(function (w) { var l = idx.byWord[w]; if (l && (!pool || l.length < pool.length)) pool = l; });
  var cands = pool ? pool.map(function (i) { return idx.words[i]; }) : idx.words;
  var best = null, bestExtra = 99;
  cands.forEach(function (e) {
    if (e.w.length - want.length >= bestExtra || e.w.length < want.length) return;
    var used = [];
    for (var i = 0; i < want.length; i++) {
      var ok = false;
      for (var j = 0; j < e.w.length; j++) if (used.indexOf(j) < 0 && nearWord(want[i], e.w[j])) { used.push(j); ok = true; break; }
      if (!ok) return;
    }
    var extra = e.w.length - want.length;

function readCoverCache(sys) {

    var obj = JSON.parse(raw);

}

}

  var api = 'https://api.github.com/repos/libretro-thumbnails/' + repoName(sys) + '/git/trees/';
  return fetch(api + 'master').then(function (r) { if (!r.ok) throw new Error('GitHub ' + r.status); return r.json(); })
    .then(function (root) {
      var bx = root.tree.filter(function (e) { return e.path === 'Named_Boxarts'; })[0];
      if (!bx) return [];
      return fetch(api + bx.sha).then(function (r) { if (!r.ok) throw new Error('GitHub ' + r.status); return r.json(); });
    })
    .then(function (sub) { return (sub.tree || []).map(function (e) { return e.path; }).filter(function (p) { return /\.png$/i.test(p); }); });
}
function loadCoverIndexes() {
  var systems = [];
  state.consoles.forEach(function (c) { if (c.info.sys && systems.indexOf(c.info.sys) < 0 && !COVER_IDX[c.info.sys]) systems.push(c.info.sys); });
  var queue = [];
  systems.forEach(function (sys) {
    var cached = readCoverCache(sys);
    if (cached) COVER_IDX[sys] = buildCoverIdx(cached);
    else { COVER_IDX[sys] = 'loading'; queue.push(sys); }
  });
  // baixa no máximo 3 listas ao mesmo tempo
  function next() {
    var sys = queue.shift();
    if (!sys) return;
    fetchCoverNames(sys).then(function (names) {
      writeCoverCache(sys, names);
      MATCH_MEM[sys] = {}; try { localStorage.removeItem('arc-match-v1:' + sys); } catch (e) { /* ok */ }
      COVER_IDX[sys] = buildCoverIdx(names);
      state.all.forEach(function (g) { if (g.sys === sys) delete g._cover; });
      refreshCovers();
    }).catch(function (e) { console.warn('capas', sys, e); COVER_IDX[sys] = null; }).then(next);
  }
  next(); next(); next();
}
var coverTimer;
function refreshCovers() {
  clearTimeout(coverTimer);
  coverTimer = setTimeout(function () { var y = window.scrollY; render(); window.scrollTo(0, y); }, 250);
}

/* As capas originais são PNGs grandes (centenas de KB cada). Passamos pelo wsrv.nl,
   um redimensionador público e gratuito, que devolve WebP do tamanho certo (~10–20 KB).
   Se ele falhar, a imagem cai no PNG original. */
var IMG_PROXY = 'https://wsrv.nl/?url=';
function sized(raw, w, extra) { return IMG_PROXY + encodeURIComponent(raw) + '&w=' + w + '&output=webp&q=72' + (extra || ''); }
// w: largura em pixels (padrão 320, bom pra cards). blur: true pra fundos desfocados (imagem minúscula).
function coverUrls(g, w, blur) {
  if (!g.sys) return [];
  var idx = COVER_IDX[g.sys];
  if (idx === 'loading') return [];                // espera a lista: evita disparar dezenas de tentativas que dão 404
  var repo = 'https://raw.githubusercontent.com/libretro-thumbnails/' + repoName(g.sys) + '/master/Named_Boxarts/';
  var raw = function (n) { return repo + encodeURIComponent(n.replace(/[&*\/:\x60<>?\\|"]/g, '_')) + '.png'; };
  w = w || 320;
  var px = function (n) { return blur ? sized(raw(n), 64, '&blur=2') : sized(raw(n), w); };
  if (idx && idx.map) {
    // Lista carregada: usa só o que existe de verdade no acervo (versão leve, depois a original).
    var hit = findCover(g);
    return hit ? (blur ? [px(hit)] : [px(hit), raw(hit)]) : [];
  }
  // Lista indisponível: tenta o nome exato e variações com região (só versões leves).
  var clean = g.base.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').trim();
  var seen = {};
  return [g.base, clean + ' (USA)', clean + ' (World)', clean + ' (Europe)', clean + ' (Japan)']
    .filter(function (n) { if (seen[n]) return false; seen[n] = 1; return true; }).map(px);
}
function downloadUrl(g) { return g.folder ? 'https://drive.google.com/drive/folders/' + g.id : 'https://drive.google.com/uc?export=download&id=' + g.id; }
function driveUrl(g) { return g.folder ? 'https://drive.google.com/drive/folders/' + g.id : 'https://drive.google.com/file/d/' + g.id + '/view'; }

/* ============================================================
   Sinopse: resumo do jogo na Wikipédia (português; se não achar, inglês)
   Só aceita o artigo se for de jogo e o título bater com o nome da ROM.
   Fica guardado no navegador por 30 dias.
   ============================================================ */
var SYN_TTL = 30 * 864e5, SYN_MISS_TTL = 7 * 864e5, synInflight = {};

var CJK = String.fromCharCode(0x3040) + '-' + String.fromCharCode(0x30ff) + String.fromCharCode(0x3400) + '-' + String.fromCharCode(0x9fff) + String.fromCharCode(0xac00) + '-' + String.fromCharCode(0xd7af);
var CJK_PAREN = new RegExp('\\s*\\([^)]*[' + CJK + '][^)]*\\)', 'g');
function synKey(g) { return 'arc-sinopse-v1:' + norm(g.title); }
function synWordsOk(gameTitle, wikiTitle) {
  var want = coverWords(gameTitle).filter(function (w) { return w.length > 1 || /\d/.test(w); });
  var have = coverWords(wikiTitle);
  if (!want.length) return false;
  var miss = want.filter(function (w) { return !have.some(function (h) { return nearWord(w, h); }); }).length;
  return miss === 0 || (want.length >= 3 && miss === 1);
}
function synIsGame(p, lang) {
  if (/^(lista|list of)\b/i.test(p.title)) return false;
  var d = (p.description || '') + ' ' + (p.extract || '').slice(0, 220);
  return lang === 'pt' ? /jogo eletr|videojogo|jogo de (v[ií]deo|computador|luta|plataforma|a[cç][aã]o|rpg|corrida)|rpg eletr/i.test(d) : /video game|videogame/i.test(d);
}
function synClean(t) {
  return String(t).replace(CJK_PAREN, '').replace(/\s*\(\s*\)/g, '').replace(/\s+([,.])/g, '$1').replace(/\s{2,}/g, ' ').trim();
}
function synSearch(g, lang) {

  var url = 'https://' + lang + '.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=5' +
    '&gsrsearch=' + encodeURIComponent(g.title + extra) +
    '&prop=extracts|description&exintro=1&explaintext=1&exsentences=5&exlimit=5';
  return fetch(url).then(function (r) { if (!r.ok) throw new Error('Wikipédia ' + r.status); return r.json(); }).then(function (j) {
    var pages = j.query && j.query.pages ? Object.keys(j.query.pages).map(function (k) { return j.query.pages[k]; }) : [];
    pages.sort(function (a, b) { return a.index - b.index; });

  } catch (e) { /* ignora cache quebrado */ }

function spinRaffle() {
  var r = state.raffle;
  if (r.spinning) return;
  var pool = rafflePool();
  if (!pool.length) return;
  var stage = $('#stage'), reelEl = $('#reel');
  if (!stage || !reelEl) return;

  // evita repetir o último sorteado quando dá
  var winner = pool[rnd(pool.length)];
  if (pool.length > 1 && r.winner && winner === r.winner) winner = pool[(pool.indexOf(winner) + 1 + rnd(pool.length - 1)) % pool.length];

  $('#raffleResult').innerHTML = '';

  reelEl.className = 'reel';

  reelEl.innerHTML = list.map(reelCardHTML).join('');
  var card = reelEl.children[REEL_WIN];
  var jitter = (Math.random() - 0.5) * card.offsetWidth * 0.55;
  var target = Math.round(stage.clientWidth / 2 - (card.offsetLeft + card.offsetWidth / 2) + jitter);

    var settled = Math.round(stage.clientWidth / 2 - (card.offsetLeft + card.offsetWidth / 2));

}

function skeletonTiles() { var s = ''; for (var i = 0; i < 8; i++) s += '<div class="tile skeleton" style="--c:#2a2e3d;animation:pulse 1.4s infinite"></div>'; return s; }
// Escolhe n jogos com capa olhando só uma amostra da lista (no máximo 60 jogos),
// em vez de procurar a capa de todos: com milhares de ROMs isso travava a tela.
function pickCovers(list, n, seed) {
  var len = list.length, out = [], i, g;
  if (!len) return out;
  var start = (hash(list[0].consoleId) + (seed || 0)) % len;
  var step = Math.max(1, Math.floor(len / Math.max(n * 6, 1)));
  for (i = 0; out.length < n && i < Math.min(len, 60); i++) {
    g = list[(start + i * step + Math.floor(i * step / len)) % len];
    if (out.indexOf(g) < 0 && hasCover(g)) out.push(g);
  }
  for (i = 0; out.length < n && i < len; i++) {
    g = list[(start + i) % len];
    if (out.indexOf(g) < 0) out.push(g);
  }
  return out;
}

/* ---------- página do console (e das subpastas dele) ---------- */
function inPath(g, path) {
  if (g.path.length < path.length) return false;
  for (var i = 0; i < path.length; i++) if (g.path[i] !== path[i]) return false;
  return true;
}
function totalSize(list) { return list.reduce(function (s, g) { return s + g.size; }, 0); }
function subfolders(list, path) {
  var map = {}, order = [];
  list.forEach(function (g) {
    if (g.path.length <= path.length) return;
    var name = g.path[path.length];
    if (!map[name]) { map[name] = { name: name, items: [] }; order.push(name); }
    map[name].items.push(g);
  });
  // Pastas de jogos primeiro (Jogos, Games, ROMs), depois o resto em ordem alfabética.
  var rank = function (n) { return /^(jogos?|games?|roms?)$/i.test(n) ? 0 : 1; };
  order.sort(function (a, b) { return rank(a) - rank(b) || a.localeCompare(b, 'pt-BR'); });
  return order.map(function (n) { return map[n]; });
}
function folderTilesHTML(subs, c) {
  return '<div class="consoles folders">' + subs.map(function (s) {
    var picks = pickCovers(s.items, 3);
    return '<button class="tile sub" style="--c:' + c.info.color + '" data-sub="' + esc(s.name) + '">' +
      '<div class="fan" aria-hidden="true">' + picks.map(function (g) { return posterHTML(g, false); }).join('') + '</div>' +
      '<div class="label">' +
        '<div class="ficon">' + ICON.folder + '</div>' +
        '<div class="short">' + esc(s.name) + '</div>' +
        '<div class="count">' + plural(s.items.length, 'arquivo', 'arquivos') + ' · ' + fmtSize(totalSize(s.items)) + '</div>' +
      '</div>' +
    '</button>';
  }).join('') + '</div>';
}
function renderConsole(id) {
  var c = state.byId[id];

    return;
  }
  var inside = c.games.filter(function (g) { return inPath(g, path); });

  var subs = subfolders(inside, path);

  if (!path.length) {

    var recent = inside.slice().sort(function (a, b) { return b.updated - a.updated; }).slice(0, 24);

  }

  if (direct.length) {

/* ---------- busca ---------- */
function searchHits() {
  var terms = state.q.toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  return state.all.filter(function (g) {

    return true;

function renderSearch() {

/* ============================================================
   Navegação
   ============================================================ */
function go(view) {
  state.view = view; state.gridLimit = 120; state.menuOpen = false;
  if (view.type !== 'search') { state.q = ''; }
  render(); window.scrollTo(0, 0);
}

document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.closest('a[href]')) return; // links (baixar / drive) seguem normalmente
  var el;
  if ((el = t.closest('[data-fav]'))) { toggleFav(el.getAttribute('data-fav')); return; }
  if ((el = t.closest('[data-hero]'))) { showHero(Number(el.getAttribute('data-hero'))); return; }
  if ((el = t.closest('[data-listsort]'))) { state.listSort = el.getAttribute('data-listsort'); render(); return; }
  // menu de consoles: abre/fecha; clique fora fecha
  if (t.closest('[data-menu]')) {
    state.menuOpen = !state.menuOpen;
    document.querySelectorAll('.menu-wrap').forEach(function (m) { m.classList.toggle('open', state.menuOpen); });
    return;
  }
  if (state.menuOpen && !t.closest('.menu')) {
    state.menuOpen = false;
    document.querySelectorAll('.menu-wrap').forEach(function (m) { m.classList.remove('open'); });
  }
  if ((el = t.closest('[data-nav]'))) {
    closeModal(); state.filters = [];
    state.emuFilter = el.getAttribute('data-emu-for') || null;
    go({ type: el.getAttribute('data-nav') }); return;
  }
  if ((el = t.closest('[data-emu-filter]'))) { state.emuFilter = el.getAttribute('data-emu-filter') || null; render(); return; }
  if (t.closest('[data-focus-search]')) { var qi = $('#q'); window.scrollTo(0, 0); qi.focus(); qi.select(); return; }
  if ((el = t.closest('[data-open]'))) { openModal(el.getAttribute('data-open')); return; }
  if (t.closest('[data-close]') || t.id === 'modalBg') { closeModal(); return; }
  if ((el = t.closest('[data-console]'))) { closeModal(); state.filters = []; go({ type: 'console', id: el.getAttribute('data-console'), path: [] }); return; }
  if ((el = t.closest('[data-sub]'))) { go({ type: 'console', id: state.view.id, path: (state.view.path || []).concat([el.getAttribute('data-sub')]) }); return; }
  if ((el = t.closest('[data-crumb]'))) { go({ type: 'console', id: state.view.id, path: (state.view.path || []).slice(0, Number(el.getAttribute('data-crumb'))) }); return; }
  if ((el = t.closest('[data-goto]'))) {
    var g0 = state.byKey[el.getAttribute('data-goto')]; closeModal(); state.filters = []; state.q = '';
    go({ type: 'console', id: g0.consoleId, path: g0.path.slice() }); return;
  }
  if (t.closest('[data-home]')) { closeModal(); state.filters = []; go({ type: 'home' }); return; }
  if ((el = t.closest('[data-filter]'))) {
    var id = el.getAttribute('data-filter'), i = state.filters.indexOf(id);
    if (i >= 0) state.filters.splice(i, 1); else state.filters.push(id);
    state.gridLimit = 120; render(); return;
  }
  if (t.closest('[data-filter-clear]')) { state.filters = []; render(); return; }
  if ((el = t.closest('[data-sort]'))) { state.sort = el.getAttribute('data-sort'); state.gridLimit = 120; render(); return; }
  if (t.closest('[data-more]')) { var y = window.scrollY; state.gridLimit += 120; render(); window.scrollTo(0, y); return; }
  if (t.closest('[data-shuffle]')) { var c = state.byId[state.view.id]; state.featured[c.id] = c.games[Math.floor(Math.random() * c.games.length)]; render(); return; }
  if ((el = t.closest('[data-fscroll]'))) { var fl = el.parentNode.querySelector('.filters'); fl.scrollBy({ left: fl.clientWidth * 0.7 * Number(el.getAttribute('data-fscroll')) }); return; }
  if ((el = t.closest('[data-franchise]'))) { go({ type: 'franchise', id: el.getAttribute('data-franchise') }); return; }
  if ((el = t.closest('[data-franchise-pick]'))) {
    var fp = FRANCHISES.filter(function (x) { return x.id === el.getAttribute('data-franchise-pick'); })[0];
    var fl2 = fp ? franchiseGames(fp) : [];
    if (fl2.length) openModal(fl2[rnd(fl2.length)].key);
    return;
  }
  if ((el = t.closest('[data-raffle-opt]'))) { var ok = el.getAttribute('data-raffle-opt'); state.raffle[ok] = !state.raffle[ok]; resetRaffle(); render(); return; }
  if (t.closest('[data-spin]')) { spinRaffle(); return; }
  if ((el = t.closest('[data-syn-more]'))) { var sb = el.closest('.syn'); var op = sb.classList.toggle('open'); el.textContent = op ? 'Ler menos' : 'Ler mais'; return; }
  if ((el = t.closest('.arrow'))) { var rail = el.parentNode.querySelector('.rail'); rail.scrollBy({ left: rail.clientWidth * 0.85 * Number(el.getAttribute('data-dir')) }); return; }
  if (t.closest('#refresh')) { load(true); return; }
});

var qTimer, viewBeforeSearch = { type: 'home' };
document.addEventListener('input', function (e) {
  if (e.target.id !== 'q') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(function () {
    var q = e.target.value.trim();
    if (q) {
      if (state.view.type !== 'search') {
        viewBeforeSearch = state.view;
        // começando a busca dentro de um console: já filtra por ele
        state.filters = state.view.type === 'console' ? [state.view.id] : [];
      }
      state.q = q; state.view = { type: 'search' }; state.gridLimit = 120; render();
    } else if (state.view.type === 'search') {
      state.q = ''; state.view = viewBeforeSearch; state.filters = []; render();
    }
  }, 160);
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if ($('#modalBg').classList.contains('open')) return closeModal();
    if (state.menuOpen) { state.menuOpen = false; document.querySelectorAll('.menu-wrap').forEach(function (m) { m.classList.remove('open'); }); return; }
    if (state.view.type === 'franchise') { go({ type: 'franchises' }); return; }
    if (/^(emus|consoles|mylist|raffle|franchises)$/.test(state.view.type)) { if (!state.raffle.spinning) go({ type: 'home' }); return; }
    if (state.view.type === 'search') { state.q = ''; state.filters = []; go(viewBeforeSearch); return; }
    if (state.view.type === 'console') {
      var p = state.view.path || [];
      if (p.length) go({ type: 'console', id: state.view.id, path: p.slice(0, -1) });
      else go({ type: 'consoles' });
    }
    return;
  }
  var typing = /input|textarea|select/i.test(document.activeElement.tagName);
  if (e.key === ' ' && !typing && state.view.type === 'raffle' && !$('#modalBg').classList.contains('open') && !/button|a/i.test(document.activeElement.tagName)) { e.preventDefault(); spinRaffle(); return; }
  if (e.key === '/' && !typing) { e.preventDefault(); var q = $('#q'); q.focus(); q.select(); }
});

/* ============================================================
   Carregamento
   ============================================================ */
function ingest(c, files) {
  c.games = files.map(function (f) {
    var p = parseName(f.file, f.folder);
    return {
      id: f.id, key: f.id, file: f.file, size: f.size || 0, updated: f.updated, folder: !!f.folder,
      path: f.path || [],
      base: p.base, ext: p.ext, title: p.title,
      tags: p.tags.filter(function (t) { return !/^[0-9a-f]{16}$/i.test(t); }),
      consoleId: c.id, consoleName: c.name, short: c.info.short, color: c.info.color, sys: c.info.sys,
      pt: isPtBr(p.base) || c.ptbr,
      searchKey: norm(p.title + ' ' + p.base + ' ' + c.name + ' ' + c.info.short + ' ' + (f.path || []).join(' '))
    };
  });
  state.all = [];
  state.consoles.forEach(function (x) { if (x.games) state.all = state.all.concat(x.games); });
  state.byKey = {};
  state.all.forEach(function (g) { state.byKey[g.key] = g; });
}

var renderQueued = false, lastRender = 0;
function scheduleRender() {
  // junta várias chegadas de console num redesenho só (no máximo ~1 a cada 0,6 s)
  if (renderQueued) return;
  renderQueued = true;
  var wait = Math.max(0, 600 - (Date.now() - lastRender));
  setTimeout(function () { requestAnimationFrame(function () {
    renderQueued = false; lastRender = Date.now();
    // não redesenha enquanto o usuário rola uma página de console já carregada
    if (state.view.type === 'console' && state.byId[state.view.id].games && state.renderedConsole === state.view.id) return;
    var y = window.scrollY; render(); window.scrollTo(0, y);
    if (state.view.type === 'console' && state.byId[state.view.id].games) state.renderedConsole = state.view.id;
  }); }, wait);
}

function load(force) {
  var btn = $('#refresh'); if (btn) btn.classList.add('spin');
  state.renderedConsole = null;
  return call(force ? 'clearCache' : 'getConsoles', false).then(function (list) {
    var prevView = state.view;
    state.consoles = list.map(function (c) { return { id: c.id, name: c.name.trim(), info: consoleInfo(c.name), ptbr: isPtBr(c.name), games: null }; });
    state.byId = {}; state.consoles.forEach(function (c) { state.byId[c.id] = c; });
    state.all = []; state.byKey = {}; state.heroPicks = null;
    if (prevView.type === 'console' && !state.byId[prevView.id]) state.view = { type: 'home' };
    loadCoverIndexes();
    render();
    return Promise.all(state.consoles.map(function (c) {
      return call('getGames', c.id, false)
        .then(function (files) { ingest(c, files); scheduleRender(); })
        .catch(function (err) { ingest(c, []); console.error(c.name, err); scheduleRender(); });
    }));
  }).then(function () {
    var b = $('#refresh'); if (b) b.classList.remove('spin');
    if (force) toast('Lista recarregada do Drive');
  }).catch(function (err) {
    app.innerHTML = barHTML('') + '<div class="error-box"><strong>Não consegui ler a pasta do Drive.</strong><br>' +
      'Confira se o <code>ROOT_FOLDER_ID</code> no <code>Code.gs</code> está certo e se você autorizou o acesso ao Drive.<br>' +
      '<small style="color:var(--muted)">' + esc(err && err.message || err) + '</small></div>';
  });
}
